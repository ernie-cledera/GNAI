<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e87e9" />
      <stop offset="100%" stop-color="#0c3d6e" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Outer Ring symbolizing global alliance -->
  <circle cx="50" cy="50" r="46" stroke="url(#primaryGrad)" stroke-width="4" stroke-dasharray="1 3" />
  <circle cx="50" cy="50" r="42" fill="white" stroke="#e0effe" stroke-width="1.5" />
  
  <!-- Stylized Heart/Caring Hands embracing cross -->
  <path d="M50 20 C35 10 18 26 24 44 C28 56 42 70 50 78 C58 70 72 56 76 44 C82 26 65 10 50 20 Z" fill="#f0f7ff" stroke="url(#tealGrad)" stroke-width="2.5" opacity="0.9" />
  
  <!-- Medical Cross with rounded caps -->
  <rect x="44" y="32" width="12" height="32" rx="4" fill="url(#primaryGrad)" />
  <rect x="34" y="42" width="32" height="12" rx="4" fill="url(#primaryGrad)" />
  
  <!-- Compassion Star / Sparkle in center -->
  <circle cx="50" cy="48" r="3.5" fill="url(#goldGrad)" />
  <circle cx="50" cy="48" r="1.5" fill="#ffffff" />
</svg>
